# Railway Configuration for Backtesting Research Tool
# Docs: https://docs.railway.app/reference/config-as-code

[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements.txt"

[deploy]
# Run migrations first, then start server
startCommand = "pip install tqdm && alembic upgrade head && uvicorn api.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Environment-specific configurations
[environments.development]
[environments.development.deploy]
healthcheckPath = "/"

[environments.staging]
[environments.staging.deploy]
healthcheckPath = "/"
