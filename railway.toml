# Railway Configuration for Backtesting Research Tool
# Docs: https://docs.railway.app/reference/config-as-code

[build]
builder = "NIXPACKS"
buildCommand = "pip install --no-cache-dir -r requirements.txt"

[deploy]
# Start server (run migrations manually via: railway run alembic upgrade head)
startCommand = "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/"
healthcheckTimeout = 200
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Environment-specific configurations
[environments.development]
[environments.development.deploy]
healthcheckPath = "/"

[environments.staging]
[environments.staging.deploy]
healthcheckPath = "/"
